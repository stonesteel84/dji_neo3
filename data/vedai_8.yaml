# YOLOv5 🚀 by Ultralytics, GPL-3.0 license
# COCO128 dataset https://www.kaggle.com/ultralytics/coco128 (first 128 images from COCO train2017)
# Example usage: python train.py --data coco128.yaml
# parent
# ├── yolov5
# └── datasets
#     └── coco128  ← downloads here

# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path: /media/kim/SY_SSD1TB/data_1/VEDAI/vedai_8 # dataset root dir
train: /media/kim/SY_SSD1TB/data_1/VEDAI/vedai_8/images/train2017  # train images (relative to 'path') 128 images
val: /media/kim/SY_SSD1TB/data_1/VEDAI/vedai_8/images/val2017 # val images (relative to 'path') 128 images
#val: images/val2022  # val images (relative to 'path') 128 images
test:  # test images (optional)

# Classes
nc: 8  # number of classes
names: ['car','pick-up','camping car','truck','vehicle','tractor','boat','van']  # class names


# Download script/URL (optional)
# download: https://github.com/ultralytics/yolov5/releases/download/v1.0/coco128.zip