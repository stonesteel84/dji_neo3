# TS-RPST on YOLO26-P2 (P2/4 - P5/32). Derived from ultralytics/cfg/models/26/yolo26-p2.yaml (AGPL-3.0).
# Use as yolo26{n,s,m,l,x}-tsrpst-p2.yaml. The extra stride-4 output level is the recommended variant for AI-TOD
# (mean object size ~12 px): RPST then transfers scale trajectories over four pyramid levels (P2..P5).

nc: 8 # AI-TOD classes
end2end: True
reg_max: 1
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, TinyObjectSurvivalDownsample, [128, 3, 2]] # 1-P2/4  (TOSD)
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, TinyObjectSurvivalDownsample, [256, 3, 2]] # 3-P3/8  (TOSD)
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [[-1, 6], 1, UAFeatureUpsample, [16, 32, 3, 2, 0.0]] # 11: P5 -> P4
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  - [[-1, 4], 1, UAFeatureUpsample, [16, 32, 3, 2, 0.0]] # 14: P4 -> P3
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)

  - [[-1, 2], 1, UAFeatureUpsample, [16, 32, 3, 2, 0.0]] # 17: P3 -> P2
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 2, C3k2, [128, True]] # 19 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]] # cat head P3
  - [-1, 2, C3k2, [256, True]] # 22 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 25 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 28 (P5/32-large)

  - [[19, 22, 25, 28], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
