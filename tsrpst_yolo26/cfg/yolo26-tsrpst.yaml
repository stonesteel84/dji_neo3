# TS-RPST on YOLO26 (P3/8 - P5/32). Derived from ultralytics/cfg/models/26/yolo26.yaml (AGPL-3.0).
# Use as yolo26{n,s,m,l,x}-tsrpst.yaml; the scale letter picks the row in `scales`.
#
# Changes w.r.t. plain YOLO26:
#   * backbone layers 1 (P2/4) and 3 (P3/8): Conv -> TinyObjectSurvivalDownsample (TOSD, survival-supervised)
#   * head upsampling: nn.Upsample -> UAFeatureUpsample guided by the backbone feature at the target resolution
# RPST has no layers: it is a training-only loss attached by TSRPSTTrainer.

nc: 8 # AI-TOD classes
end2end: True # NMS-free one-to-one head is trained alongside the one-to-many head
reg_max: 1 # YOLO26: no DFL
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, TinyObjectSurvivalDownsample, [128, 3, 2]] # 1-P2/4  (TOSD)
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, TinyObjectSurvivalDownsample, [256, 3, 2]] # 3-P3/8  (TOSD)
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # UAFeatureUpsample args: [guide_dim, hidden_dim, kernel_size, scale_factor, residual_init]
  - [[-1, 6], 1, UAFeatureUpsample, [16, 32, 3, 2, 0.0]] # 11: P5 -> P4, guided by backbone P4
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13

  - [[-1, 4], 1, UAFeatureUpsample, [16, 32, 3, 2, 0.0]] # 14: P4 -> P3, guided by backbone P3
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
